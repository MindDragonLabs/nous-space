<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOUS SPACE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.47.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg: #0d0d0f;
  --surface: #16161a;
  --border: #2a2a30;
  --text: #e4e4e7;
  --muted: #a0a0a8;
  --nous-blue: #0071A9;
  --nous-electric: #00AEEF;
  --nous-purple: #8B5CF6;
  --nous-amber: #F59E0B;
  --green: #22c55e;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1;
  min-height: 100vh;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--nous-amber); outline-offset: 2px; border-radius: 5px; }

/* === TOPNAV — mempool.space style === */
.topnav {
  display: flex;
  align-items: center;
  height: 58px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  gap: 0;
  position: sticky;
  top: 0;
  z-index: 100;
}

/* Brand: avatar + stacked NOUS / SPACE */
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
  margin-right: 16px;
}
.brand-avatar {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  object-fit: cover;
}
.brand-wordmark {
  display: flex;
  flex-direction: column;
  line-height: 1;
  gap: 2px;
}
.brand-nous {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.26em;
  color: var(--nous-electric);
}
.brand-space {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.44em;
  color: var(--nous-purple);
}

/* Thin separator pipes */
.sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  margin: 0 8px;
  flex-shrink: 0;
}

/* Branch dropdown */
.dropdown-wrapper { position: relative; flex-shrink: 0; }
.branch-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  transition: border-color 0.15s;
}
.branch-btn:hover { border-color: var(--nous-amber); }
.branch-btn .ti { font-size: 16px; color: var(--nous-amber); }
.branch-btn .branch-name { font-weight: 600; color: var(--text); }
.branch-btn .ti-chevron-down { font-size: 11px; margin-left: 2px; }

.dropdown-menu {
  position: absolute;
  top: calc(100% + 5px);
  left: 0;
  min-width: 150px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  padding: 3px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: none;
  z-index: 200;
}
.dropdown-menu.open { display: block; }
.dropdown-item {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 6px 10px;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  text-align: left;
  transition: background 0.1s;
}
.dropdown-item:hover { background: rgba(139, 92, 246, 0.12); }
.dropdown-item .ti { font-size: 14px; color: var(--muted); }
.dropdown-item .check { margin-left: auto; color: var(--nous-amber); font-size: 13px; }

/* Spacer — NOT USED, everything flows left */
/* .nav-spacer removed — icons stay near the brand */

/* Icon-only nav — no text */
.nav-icons {
  display: flex;
  align-items: center;
  gap: 3px;
}
.nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 6px;
  color: var(--muted);
  transition: color 0.15s, background 0.15s;
}
.nav-icon:hover { color: var(--text); background: rgba(245,158,11,0.09); }
.nav-icon .ti { font-size: 22px; }
.nav-icon.active { color: var(--nous-amber); background: rgba(245,158,11,0.13); }
.nav-icon.active .ti { color: var(--nous-amber); }

/* Search — mempool.space style: input + separate purple button */
.search-bar {
  display: flex;
  align-items: center;
  gap: 0;
  margin-left: auto;
  min-width: 200px;
  max-width: 380px;
  flex: 1;
}
.search-bar input {
  flex: 1;
  height: 38px;
  padding: 0 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-right: none;
  border-radius: 6px 0 0 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
}
.search-bar input:focus { border-color: rgba(17, 19, 31, 0.2); box-shadow: none; }
.search-bar input::placeholder { color: var(--muted); }
.search-submit {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 38px;
  background: var(--nous-purple);
  border: 1px solid var(--nous-purple);
  border-radius: 0 6px 6px 0;
  color: #fff;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.search-submit:hover { background: #7c4ddb; border-color: #7c4ddb; }
.search-submit .ti { font-size: 16px; color: #fff; }

/* === MAIN CONTENT — isometric cube grid === */
.main-content {
  min-height: calc(100vh - 58px);
  padding: 20px 14px;
  display: flex;
  gap: 24px;
}

/* Left zone — cube row */
.zone-left {
  flex: 1;
  display: flex;
  align-items: flex-end;
  gap: 0;
  min-width: 0;
  position: relative;
  padding-top: 30px; /* room for top face */
}

/* Isometric cube — mempool.space block style */
.cube {
  position: relative;
  width: 140px;
  height: 140px;
  flex-shrink: 0;
  cursor: pointer;
  margin-left: -20px;
  transition: transform 0.2s;
}
.cube:first-child { margin-left: 0; }
.cube:hover { transform: translateY(-4px); }

/* Front face */
.cube-face {
  width: 100%;
  height: 100%;
  background: #1a5c2e;
  border: 1px solid #2a7a3e;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  z-index: 2;
  position: relative;
}

/* Left face (side) */
.cube::before {
  content: '';
  width: calc(0.16 * 140px);
  height: 140px;
  position: absolute;
  top: calc(-0.096 * 140px);
  left: calc(-0.16 * 140px);
  background-color: #145126;
  border-left: 1px solid #2a7a3e;
  border-bottom: 1px solid #2a7a3e;
  z-index: -1;
  transform: skewY(50deg);
  transform-origin: top;
}

/* Top face */
.cube::after {
  content: '';
  width: 140px;
  height: calc(0.192 * 140px);
  position: absolute;
  top: calc(-0.192 * 140px);
  left: calc(-0.16 * 140px);
  background-color: #228b3a;
  border-top: 1px solid #2a7a3e;
  border-right: 1px solid #2a7a3e;
  transform: skew(40deg);
  transform-origin: top;
}

/* Cube content text */
.cube-pr {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 700;
  color: #a8f0ba;
  margin-bottom: 6px;
  text-align: center;
}
.cube-diff {
  font-family: var(--mono);
  font-size: 13px;
  color: #d4f5de;
  margin-bottom: 4px;
  text-align: center;
}
.cube-diff .add { color: #6fff8f; }
.cube-diff .del { color: #ff8888; }
.cube-prs {
  font-family: var(--mono);
  font-size: 11px;
  color: #8bc49a;
  margin-bottom: 2px;
  text-align: center;
}
.cube-time {
  font-family: var(--mono);
  font-size: 11px;
  color: #8bc49a;
  text-align: center;
}

/* Divider line — mempool NOW column style */
.zone-divider {
  width: 2px;
  align-self: stretch;
  background: linear-gradient(180deg, transparent, var(--nous-amber) 12%, var(--nous-amber) 88%, transparent);
  opacity: 0.55;
  flex-shrink: 0;
}

/* Right zone — placeholder */
.zone-right {
  flex: 1;
  min-width: 0;
}
</style>
</head>
<body>

<nav class="topnav">
  <!-- Brand -->
  <div class="brand">
    <img class="brand-avatar" src="nous-girl.jpg" alt="">
    <div class="brand-wordmark">
      <span class="brand-nous">NOUS</span>
      <span class="brand-space">SPACE</span>
    </div>
  </div>

  <div class="sep"></div>

  <!-- Branch dropdown -->
  <div class="dropdown-wrapper">
    <button class="branch-btn" id="branchBtn" onclick="toggleDropdown()">
      <i class="ti ti-git-branch"></i>
      <span class="branch-name" id="currentBranch">main</span>
      <i class="ti ti-chevron-down"></i>
    </button>
    <div class="dropdown-menu" id="branchDropdown">
      <button class="dropdown-item" onclick="selectBranch('main')">
        <i class="ti ti-git-branch"></i>
        main
        <i class="ti ti-check check"></i>
      </button>
    </div>
  </div>

  <div class="sep"></div>

  <!-- Icons only: Dashboard · Issues · PRs · Contributors · Info -->
  <div class="nav-icons">
    <button class="nav-icon active" title="Dashboard">
      <i class="ti ti-gauge"></i>
    </button>
    <button class="nav-icon" title="Issues">
      <i class="ti ti-bug"></i>
    </button>
    <button class="nav-icon" title="PRs">
      <i class="ti ti-git-pull-request"></i>
    </button>
    <button class="nav-icon" title="Contributors">
      <i class="ti ti-users"></i>
    </button>
    <button class="nav-icon" title="Info">
      <i class="ti ti-info-circle"></i>
    </button>
  </div>

  <div class="sep"></div>

  <div class="search-bar">
    <input type="text" placeholder="Explore the full Hermes ecosystem">
    <button class="search-submit" type="button">
      <i class="ti ti-search"></i>
    </button>
  </div>
</nav>

<main class="main-content">
  <div class="zone-left" id="zoneLeft">
    <!-- 4th most recent (oldest) far left -->
    <div class="cube">
      <div class="cube-face">
        <div class="cube-pr">#116997</div>
        <div class="cube-diff"><span class="add">+91</span>&nbsp;<span class="del">-5</span></div>
        <div class="cube-prs">1 PR · 3 files</div>
        <div class="cube-time">~37 min</div>
      </div>
    </div>
    <!-- 3rd most recent -->
    <div class="cube">
      <div class="cube-face">
        <div class="cube-pr">#116999</div>
        <div class="cube-diff"><span class="add">+137</span>&nbsp;<span class="del">-4</span></div>
        <div class="cube-prs">2 commits · 4 files</div>
        <div class="cube-time">~32 min</div>
      </div>
    </div>
    <!-- 2nd most recent -->
    <div class="cube">
      <div class="cube-face">
        <div class="cube-pr">#117000</div>
        <div class="cube-diff"><span class="add">+81</span>&nbsp;<span class="del">-7</span></div>
        <div class="cube-prs">1 PR · 3 files</div>
        <div class="cube-time">~31 min</div>
      </div>
    </div>
    <!-- 1st most recent (newest) next to divider -->
    <div class="cube">
      <div class="cube-face">
        <div class="cube-pr">#116933</div>
        <div class="cube-diff"><span class="add">+131</span>&nbsp;<span class="del">-40</span></div>
        <div class="cube-prs">1 PR · 3 files</div>
        <div class="cube-time">~28 min</div>
      </div>
    </div>
  </div>

  <div class="zone-divider"></div>

  <div class="zone-right">
    <!-- Right zone — placeholder -->
  </div>
</main>

<script>
function toggleDropdown() {
  document.getElementById('branchDropdown').classList.toggle('open');
}
function selectBranch(name) {
  document.getElementById('currentBranch').textContent = name;
  document.getElementById('branchDropdown').classList.remove('open');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.dropdown-wrapper')) {
    document.getElementById('branchDropdown').classList.remove('open');
  }
});
document.querySelectorAll('.nav-icon').forEach(icon => {
  icon.addEventListener('click', function() {
    document.querySelectorAll('.nav-icon').forEach(i => i.classList.remove('active'));
    this.classList.add('active');
  });
});
</script>

</body>
</html>
